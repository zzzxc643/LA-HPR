name: Build and publish experiment containers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/**
      - requirements/**
      - .github/workflows/containers.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [verify, compiler, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Free space for CUDA dependencies
        if: matrix.target == 'gpu'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.target }}-20261101
            ghcr.io/${{ github.repository }}:${{ matrix.target }}-sha-${{ github.sha }}
      - name: Record published digest
        run: echo '${{ matrix.target }}=${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
