name: Build and publish experiment containers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - EXPERIMENTS.md
      - DATA_CARD.md
      - REPRODUCIBILITY.md
      - CONTAINERS.md
      - THIRD_PARTY_NOTICES.md
      - scripts/**
      - data/**
      - experiments/**
      - docker/**
      - requirements/**
      - .github/workflows/containers.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [verify, compiler, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Free space for CUDA dependencies
        if: matrix.target == 'gpu'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase image name
        id: registry
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.registry.outputs.image }}:${{ matrix.target }}-20261101
            ${{ steps.registry.outputs.image }}:${{ matrix.target }}-sha-${{ github.sha }}
      - name: Record published digest
        run: echo '${{ matrix.target }}=${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
